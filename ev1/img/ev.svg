<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 322" width="820" height="322" role="img" aria-label="A compact electric car driving on an open highway.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e0ea"/>
      <stop offset="1" stop-color="#eef0ee"/>
    </linearGradient>
  </defs>
  <rect width="820" height="322" fill="url(#sky)"/>
  <circle cx="660" cy="70" r="28" fill="#f5f1e8" opacity=".9"/>

  <!-- far hills -->
  <path d="M0 196 Q140 150 290 178 Q430 204 560 166 Q690 132 820 160 V322 H0 Z" fill="#c7d0d4"/>
  <path d="M0 214 Q170 186 340 206 Q520 226 680 196 Q760 184 820 192 V322 H0 Z" fill="#b3bec2"/>

  <!-- road -->
  <rect x="0" y="246" width="820" height="76" fill="#8b929c"/>
  <rect x="0" y="246" width="820" height="4" fill="#7a818b"/>
  <g fill="#e9ecef">
    <rect x="20" y="286" width="70" height="6" rx="3"/><rect x="150" y="286" width="70" height="6" rx="3"/>
    <rect x="280" y="286" width="70" height="6" rx="3"/><rect x="410" y="286" width="70" height="6" rx="3"/>
    <rect x="540" y="286" width="70" height="6" rx="3"/><rect x="670" y="286" width="70" height="6" rx="3"/>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7">
    <line x1="150" y1="196" x2="228" y2="196"/><line x1="122" y1="214" x2="214" y2="214"/><line x1="160" y1="232" x2="226" y2="232"/>
  </g>

  <!-- the car: a compact electric car, side view -->
  <ellipse cx="402" cy="268" rx="176" ry="7" fill="#14161a" opacity=".12"/>
  <path d="M238 246 V214 Q238 196 258 192 L318 182 Q338 150 380 144 H470 Q500 144 522 168 L548 190 Q574 194 578 214 V246 Q578 252 572 252 H244 Q238 252 238 246 Z" fill="#5e6e84"/>
  <path d="M336 186 Q352 158 384 156 H426 V186 Z" fill="#dde4ec"/>
  <path d="M436 156 H468 Q490 156 506 172 L520 186 H436 Z" fill="#dde4ec"/>
  <rect x="428" y="156" width="6" height="32" fill="#5e6e84"/>
  <rect x="250" y="206" width="22" height="8" rx="3" fill="#f3e7c4"/>
  <rect x="560" y="206" width="14" height="8" rx="3" fill="#d98a7f"/>
  <path d="M398 200 L388 216 H398 L392 232 L410 210 H400 L406 200 Z" fill="#eaf0f6"/>

  <!-- wheels -->
  <g>
    <circle cx="300" cy="250" r="27" fill="#2b2f36"/><circle cx="300" cy="250" r="12" fill="#c9ced6"/>
    <circle cx="512" cy="250" r="27" fill="#2b2f36"/><circle cx="512" cy="250" r="12" fill="#c9ced6"/>
  </g>
</svg>
