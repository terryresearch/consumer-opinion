<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 322" width="820" height="322" role="img" aria-label="Three bottles of cold-pressed juice, green, orange and red, with blank labels.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ebe4"/>
      <stop offset="1" stop-color="#f1f1ec"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="820" height="322" fill="url(#wall)"/>

  <!-- counter -->
  <rect x="0" y="252" width="820" height="70" fill="#cfc6b8"/>
  <rect x="0" y="252" width="820" height="5" fill="#bdb3a3"/>

  <!-- leaves, out of focus -->
  <g opacity=".55">
    <ellipse cx="150" cy="230" rx="44" ry="16" fill="#9fb58c" transform="rotate(-24 150 230)"/>
    <ellipse cx="196" cy="238" rx="36" ry="13" fill="#8ea87b" transform="rotate(18 196 238)"/>
    <circle cx="676" cy="228" r="24" fill="#e7b46a"/>
    <circle cx="640" cy="238" r="16" fill="#d9a258"/>
  </g>

  <!-- shadows -->
  <ellipse cx="410" cy="256" rx="190" ry="8" fill="#14161a" opacity=".10"/>

  <!-- bottle 1: green -->
  <g>
    <rect x="270" y="58" width="34" height="22" rx="4" fill="#5e6e84"/>
    <path d="M276 80 h22 v14 q22 10 22 34 v116 q0 10 -10 10 h-46 q-10 0 -10 -10 v-116 q0 -24 22 -34 z" fill="#7d9a5f"/>
    <rect x="262" y="148" width="70" height="62" rx="3" fill="#f7f6f2"/>
    <rect x="276" y="168" width="42" height="5" rx="2.5" fill="#dedbd2"/>
    <rect x="282" y="180" width="30" height="5" rx="2.5" fill="#dedbd2"/>
    <path d="M276 80 h22 v14 q22 10 22 34 v116 q0 10 -10 10 h-46 q-10 0 -10 -10 v-116 q0 -24 22 -34 z" fill="url(#glass)"/>
  </g>

  <!-- bottle 2: orange -->
  <g>
    <rect x="393" y="44" width="34" height="22" rx="4" fill="#5e6e84"/>
    <path d="M399 66 h22 v14 q24 10 24 36 v128 q0 10 -10 10 h-50 q-10 0 -10 -10 v-128 q0 -26 24 -36 z" fill="#d9944a"/>
    <rect x="384" y="146" width="72" height="66" rx="3" fill="#f7f6f2"/>
    <rect x="398" y="168" width="44" height="5" rx="2.5" fill="#dedbd2"/>
    <rect x="404" y="180" width="32" height="5" rx="2.5" fill="#dedbd2"/>
    <path d="M399 66 h22 v14 q24 10 24 36 v128 q0 10 -10 10 h-50 q-10 0 -10 -10 v-128 q0 -26 24 -36 z" fill="url(#glass)"/>
  </g>

  <!-- bottle 3: red -->
  <g>
    <rect x="516" y="58" width="34" height="22" rx="4" fill="#5e6e84"/>
    <path d="M522 80 h22 v14 q22 10 22 34 v116 q0 10 -10 10 h-46 q-10 0 -10 -10 v-116 q0 -24 22 -34 z" fill="#a8505a"/>
    <rect x="508" y="148" width="70" height="62" rx="3" fill="#f7f6f2"/>
    <rect x="522" y="168" width="42" height="5" rx="2.5" fill="#dedbd2"/>
    <rect x="528" y="180" width="30" height="5" rx="2.5" fill="#dedbd2"/>
    <path d="M522 80 h22 v14 q22 10 22 34 v116 q0 10 -10 10 h-46 q-10 0 -10 -10 v-116 q0 -24 22 -34 z" fill="url(#glass)"/>
  </g>
</svg>
